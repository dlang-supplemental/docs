<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" role="img" aria-labelledby="title desc">
  <title id="title">Many-to-many partitioned GC regions</title>
  <desc id="desc">Worker 1 connects to local heap plus Region Alpha and Region Beta. Worker 2 has only a local heap. Worker 3 connects to local heap plus Region Alpha. Collecting Region Beta pauses only workers attached to it.</desc>
  <defs>
    <style>
      .label { font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; fill: #1a1a1a; }
      .title { font-family: "Segoe UI", system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #1a1a1a; }
      .small { font-family: "Segoe UI", system-ui, sans-serif; font-size: 12px; fill: #444; }
      .muted { fill: #5a5a5a; }
      .box { fill: #ffffff; stroke: #2c2c2c; stroke-width: 1.5; }
      .worker { fill: #f7f7f7; stroke: #2c2c2c; stroke-width: 1.5; }
      .local { fill: #eef6ff; stroke: #3a6ea5; stroke-width: 1.5; }
      .alpha { fill: #fff4f2; stroke: #B03931; stroke-width: 1.75; }
      .beta { fill: #f4f0fb; stroke: #6b4ea2; stroke-width: 1.75; }
      .note { fill: #fafafa; stroke: #bbbbbb; stroke-width: 1; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <text x="30" y="30" class="title">Phase 2 sketch: many-to-many regions</text>
  <text x="30" y="52" class="small muted">Not one global shared heap -- attach workers only to the regions they need</text>

  <!-- Region boxes (top) -->
  <rect x="60" y="80" width="200" height="78" rx="10" class="local"/>
  <text x="78" y="110" class="label">Worker 1 local heap</text>
  <text x="78" y="132" class="small">isolated</text>

  <rect x="360" y="80" width="200" height="78" rx="10" class="alpha"/>
  <text x="378" y="110" class="label">Region Alpha (GC)</text>
  <text x="378" y="132" class="small">shared by W1 &amp; W3</text>

  <rect x="660" y="80" width="200" height="78" rx="10" class="local"/>
  <text x="678" y="110" class="label">Worker 2 local heap</text>
  <text x="678" y="132" class="small">isolated</text>

  <rect x="210" y="200" width="220" height="78" rx="10" class="beta"/>
  <text x="228" y="230" class="label">Region Beta (GC)</text>
  <text x="228" y="252" class="small">shared by W1 &amp; W3</text>

  <!-- Workers -->
  <rect x="60" y="320" width="160" height="64" rx="10" class="worker"/>
  <text x="92" y="358" class="title">Worker 1</text>

  <rect x="380" y="320" width="160" height="64" rx="10" class="worker"/>
  <text x="412" y="358" class="title">Worker 3</text>

  <rect x="700" y="320" width="160" height="64" rx="10" class="worker"/>
  <text x="732" y="358" class="title">Worker 2</text>

  <!-- Edges: Worker1 -->
  <line x1="140" y1="320" x2="140" y2="158" stroke="#3a6ea5" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="160" y1="320" x2="420" y2="158" stroke="#B03931" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="180" y1="320" x2="280" y2="278" stroke="#6b4ea2" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Edges: Worker3 -->
  <line x1="440" y1="320" x2="480" y2="158" stroke="#B03931" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="430" y1="320" x2="340" y2="278" stroke="#6b4ea2" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Edges: Worker2 -->
  <line x1="780" y1="320" x2="780" y2="158" stroke="#3a6ea5" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Callout -->
  <rect x="520" y="200" width="340" height="100" rx="10" class="note"/>
  <text x="540" y="230" class="label">Collect Region Beta</text>
  <text x="540" y="252" class="small">Pauses only W1 and W3</text>
  <text x="540" y="274" class="small">Worker 2 is untouched</text>
  <text x="540" y="296" class="small muted">Transitive Alpha-Beta coupling can still cascade</text>
</svg>
