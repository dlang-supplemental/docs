# D Lang Supplemental documentation site (online)
# Fetches content from GitHub; use for CI and production build

site:
  title: D Lang Supplemental
  url: https://dlang-supplemental.github.io/docs
  robots: |
    User-agent: *
    Allow: /
    Sitemap: https://dlang-supplemental.github.io/docs/sitemap.xml
  start_page: asciidoctor-d:ROOT:index.adoc
  keys:
    header_logo: logo.svg
    site_home_url: https://github.com/dlang-supplemental
    site_home_label: dlang-supplemental on GitHub

urls:
  html_extension_style: indexify

content:
  sources:
    - url: https://github.com/dlang-supplemental/asciidoctor-d.git
      branches: [main]
      start_path: docs
    - url: https://github.com/dlang-supplemental/densor.git
      branches: [main]
      start_path: docs
    - url: https://github.com/dlang-supplemental/fluidsync-daemon.git
      branches: [main]
      start_path: docs
    - url: https://github.com/dlang-supplemental/vector-store-dlang.git
      branches: [main]
      start_path: docs
    - url: https://github.com/dlang-supplemental/vibe-search-core.git
      branches: [main]
      start_path: docs
    - url: https://github.com/dlang-supplemental/vibe-search-desktop.git
      branches: [main]
      start_path: docs
    - url: https://github.com/dlang-supplemental/graphrag-indexer.git
      branches: [main]
      start_path: docs
    - url: https://github.com/dlang-supplemental/opentui-d.git
      branches: [main]
      start_path: docs
    - url: https://github.com/dlang-supplemental/avalonia-d.git
      branches: [main]
      start_path: docs
    - url: .
      branches: HEAD
      start_path: docs
      worktrees: true

ui:
  bundle:
    url: https://github.com/antora-supplemental/valentus-theme/releases/download/v2/ui-bundle.zip
    snapshot: true
  supplemental_files: ./supplemental-ui

output:
  dir: ./build/site

antora:
  extensions:
    - require: "@antora-supplemental/facto-stack"
      lunr:
        index_latest_only: true
        index_by_heading: true
        snippet_length: 200
      linkValidator:
        reportEmail: dlang@devcentr.org
      orphanFinder:
        reportEmail: dlang@devcentr.org
        failOnUnresolved: false
      pageContextAntora:
        component: docs
        path: keywords
      asciidocAttributes:
        page-context-keyword-base: "/docs/keywords"
        source-highlighter: highlight.js
        icons: font
    - require: "@antora-supplemental/antora-search-chat"
    - require: ./lib/page-catalog-extension.js

asciidoc:
  attributes:
    page-context-keyword-base: "/docs/keywords"
    source-highlighter: highlight.js
    icons: font
